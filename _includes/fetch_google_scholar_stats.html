<script>
    $(document).ready(function () {
        // Fallback chain: same-origin copy (fast, works everywhere incl. mainland China)
        // -> jsdelivr mirror of the data branch -> raw.githubusercontent.
        var urls = [
            "data/scholar-stats/gs_data.json",
            "https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json",
            "https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json"
        ];

        function normTitle(t) {
            return (t || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
        }

        function findPaper(data, el) {
            var pubs = data['publications'] || {};
            var hit = pubs[el.getAttribute('data')];              // Google Scholar paper id (legacy/serpapi)
            if (hit) return hit;
            var t = normTitle(el.getAttribute('data-title'));      // normalized-title key (all sources)
            if (t && pubs[t]) return pubs[t];
            var dt = normTitle(el.getAttribute('data-title'));
            if (dt) {                                             // fuzzy: containment either way
                for (var k in pubs) {
                    if (k.indexOf(dt) >= 0 || dt.indexOf(k) >= 0) return pubs[k];
                }
            }
            return null;
        }

        function tryFetch(i) {
            if (i >= urls.length) {
                console.error("Failed to load citation data from all sources");
                var els = document.getElementsByClassName('show_paper_citations');
                Array.prototype.forEach.call(els, function (el) { el.innerHTML = ''; });
                return;
            }
            $.getJSON(urls[i], renderData).fail(function () { tryFetch(i + 1); });
        }

        function renderData(data) {
            var badge = document.getElementById('gs-citations');
            if (badge) badge.innerHTML = data['citedby'];
            var updated = document.getElementById('gs-updated');
            if (updated) {
                var when = data['updated'] ? String(data['updated']).slice(0, 10) : '';
                var source = data['source'] || '';
                var label = { 'google-scholar': '', 'openalex': ' · OpenAlex' }[source] !== undefined
                    ? { 'google-scholar': '', 'openalex': ' · OpenAlex' }[source]
                    : (source ? ' · ' + source : '');
                if (when) updated.innerHTML = ' (as of ' + when + label + ')';
                updated.title = source ? 'Data source: ' + source : '';
            }
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var p = findPaper(data, element);
                element.innerHTML = p ? '| Citations: ' + p['num_citations'] : '';
            });
        }

        tryFetch(0);
    })
</script>
