<script>
    $(document).ready(function () {
        // Fallback chain: same-origin copy (fast, works everywhere incl. mainland China)
        // -> jsdelivr mirror of the data branch -> raw.githubusercontent.
        var urls = [
            "data/scholar-stats/gs_data.json",
            "https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json",
            "https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json"
        ];

        function tryFetch(i) {
            if (i >= urls.length) {
                console.error("Failed to load Google Scholar data from all sources");
                var els = document.getElementsByClassName('show_paper_citations');
                Array.prototype.forEach.call(els, function (el) { el.innerHTML = ''; });
                return;
            }
            $.getJSON(urls[i], renderData).fail(function () { tryFetch(i + 1); });
        }

        function renderData(data) {
            var totalCitation = data['citedby'];
            var badge = document.getElementById('gs-citations');
            if (badge) badge.innerHTML = totalCitation;
            var updated = document.getElementById('gs-updated');
            if (updated && data['updated']) {
                updated.innerHTML = ' &middot; as of ' + String(data['updated']).slice(0, 10);
            }
            var citationEles = document.getElementsByClassName('show_paper_citations');
            Array.prototype.forEach.call(citationEles, function (element) {
                var paperId = element.getAttribute('data');
                if (data['publications'] && data['publications'][paperId]) {
                    element.innerHTML = '| Citations: ' + data['publications'][paperId]['num_citations'];
                } else {
                    element.innerHTML = '';
                }
            });
        }

        tryFetch(0);
    })
</script>
