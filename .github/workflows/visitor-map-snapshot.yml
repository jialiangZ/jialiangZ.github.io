name: Visitor Map Snapshot

on:
  workflow_dispatch:
  repository_dispatch:
    types: [visitor-map-snapshot]
  schedule:
    # Daily 20:00 UTC = 04:00 Beijing (next day)
    - cron: '0 20 * * *'

# GITHUB_TOKEN pushes don't trigger deploy-pages.yml (anti-recursion rule),
# so this workflow deploys Pages itself after committing the snapshot.
permissions:
  contents: write
  pages: write
  id-token: write

# Same concurrency group as deploy-pages.yml so parallel deploys never clash.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Pull full stats from Worker and commit snapshot
        env:
          SNAPSHOT_SECRET: ${{ secrets.SNAPSHOT_SECRET }}
        run: |
          set -euo pipefail
          WORKER_URL=$(node -p "require('fs').readFileSync('src/config.ts','utf8').match(/workerUrl: \"([^\"]+)\"/)[1]")
          echo "Fetching snapshot from $WORKER_URL/stats/full"
          curl -fsS -H "X-Snapshot-Secret: ${SNAPSHOT_SECRET}" "$WORKER_URL/stats/full" -o public/data/visitor-map.json
          python3 - <<'EOF'
          import json
          d = json.load(open("public/data/visitor-map.json"))
          assert "counts" in d and "daily" in d and "cities" in d, "unexpected payload shape"
          print("payload OK: total =", d["total"], "| countries =", len(d["counts"]))
          EOF
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add public/data/visitor-map.json
          if git diff --cached --quiet; then
            echo "snapshot unchanged, nothing to commit"
          else
            git commit -m "chore(visitor-map): daily stats snapshot"
            git pull --rebase origin main
            git push
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Build with Astro
        # Runs after the fresh visitor-map.json lands in public/, so the
        # build bundles today's snapshot into dist/.
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
