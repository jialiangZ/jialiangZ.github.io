name: Get Citation Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-citation-crawler]
  schedule:
    # Mon & Thu 17:00 UTC — twice a week is plenty; crawling more often
    # gets the repo's crawlers rate-limited by Google Scholar.
    - cron: '0 17 * * 1,4'

# Pushes to main only trigger a Pages rebuild (page_build does NOT re-trigger
# this workflow anymore), so there is no loop risk.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v7
    - name: Run
      run: |
        cd ./google_scholar_crawler
        pip3 install -r requirements.txt
        python3 main.py
        if [ -d "./results" ]; then
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        else
          echo "results directory does not exist, skipping commit and push"
        fi
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    - name: Sync stats into main (same-origin serving)
      if: success()
      run: |
        if [ ! -d google_scholar_crawler/results ]; then echo "no results, skip"; exit 0; fi
        mkdir -p data/scholar-stats
        cp google_scholar_crawler/results/*.json data/scholar-stats/
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add data/scholar-stats
        if git diff --cached --quiet; then
          echo "Scholar stats unchanged"
        else
          git commit -m "chore: sync scholar stats"
          git push origin HEAD:main
        fi
