name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: JS syntax check
        run: |
          node --check assets/js/visitor-map.js
          node --check assets/js/main.min.js || true
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Jekyll build (catch Liquid/SCSS errors before deploy)
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4
          bundle exec jekyll build --future
          test -f _site/index.html
          test -f _site/assets/css/main.css
          grep -q "gs-badge" _site/index.html
          grep -q "visitor-map-box" _site/index.html
