name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Syntax check + build
        run: |
          node --check public/assets/js/visitor-map.js
          node --check public/assets/js/main.min.js || true
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/robots.txt
          grep -q "gs-badge" dist/index.html
          grep -q "visitor-map-box" dist/index.html
          grep -q 'class="paper-title"' dist/index.html
