name: Get Citation Data

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-citation-crawler]
  schedule:
    # Daily 17:00 UTC — 1 SerpAPI search per run (~31/month, plan quota is
    # 250/month). Scholar anti-bot is SerpAPI's concern, not ours.
    - cron: '0 17 * * *'

# NOTE: pushes made with GITHUB_TOKEN do NOT trigger other workflows (GitHub's
# anti-recursion rule), so deploy-pages.yml never fires for our stats commits.
# This workflow therefore deploys Pages itself as its final step.
permissions:
  contents: write
  pages: write
  id-token: write

# Same concurrency group as deploy-pages.yml so parallel deploys never clash.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: npm
    - name: Build site (crawler parses dist/index.html)
      run: |
        npm ci
        npm run build
    - name: Run
      run: |
        cd ./citation-crawler
        pip3 install -r requirements.txt
        python3 main.py
        if [ -d "./results" ]; then
          cd ./results
          git init
          git config --local user.name "${GITHUB_ACTOR}"
          export remote_repo="https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          git add *.json
          git commit -m "Updated Citation Data"
          git push "${remote_repo}" HEAD:google-scholar-stats --force
        else
          echo "results directory does not exist, skipping commit and push"
        fi
      env:
        GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
    - name: Sync stats into main (same-origin serving)
      if: success()
      run: |
        if [ ! -d citation-crawler/results ]; then echo "no results, skip"; exit 0; fi
        mkdir -p public/data/scholar-stats
        cp citation-crawler/results/*.json public/data/scholar-stats/
        git config --local user.name "${GITHUB_ACTOR}"
        git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        git add public/data/scholar-stats
        if git diff --cached --quiet; then
          echo "Scholar stats unchanged"
        else
          git commit -m "chore: sync scholar stats"
          git pull --rebase origin main
          git push origin HEAD:main
        fi
    - name: Refresh stats in the prebuilt site
      # The site was built before crawling; overwrite the stale JSONs in dist/
      # so the artifact we deploy carries today's numbers.
      run: |
        mkdir -p dist/data/scholar-stats
        cp citation-crawler/results/*.json dist/data/scholar-stats/
    - uses: actions/upload-pages-artifact@v5
      with:
        path: dist
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
