name = "visitor-map"
main = "worker.js"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "visitor-map"
database_id = "0f396598-f3cc-4563-af62-2ec1047f7ffa"

# Secrets (set via CLI, never commit these):
#   wrangler secret put SNAPSHOT_SECRET  # shared password; the same value must
#   # also be added to the repo's Actions secrets — the daily snapshot workflow
#   # (.github/workflows/visitor-map-snapshot.yml) sends it as X-Snapshot-Secret.
#
# No GitHub credentials live here: repo snapshots are pulled by GitHub Actions
# using its built-in GITHUB_TOKEN.
